version: "3.8"

services:
  db:
    image: postgis/postgis:15-3.4
    container_name: vrp-database
    restart: always
    environment:
      POSTGRES_USER: vrp_user
      POSTGRES_PASSWORD: vrp_root_project
      POSTGRES_DB: vrp_db
    volumes:
      - db_data:/var/lib/postgresql/data
      - ./database.sql:/docker-entrypoint-initdb.d/database.sql:ro

  backend:
    build:
      context: ./vrp-backend
      dockerfile: Dockerfile
    container_name: vrp-backend
    restart: always
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://db:5432/vrp_db
      SPRING_DATASOURCE_USERNAME: vrp_user
      SPRING_DATASOURCE_PASSWORD: vrp_root_project
    ports:
      - "8080:8080"
    depends_on:
      - db
      - solver

  solver:
    build:
      context: ./vrp-solver
      dockerfile: Dockerfile
    container_name: vrp-solver
    restart: always

  frontend:
    build:
      context: ./vrp-frontend
      dockerfile: Dockerfile
    container_name: vrp-frontend
    restart: always
    ports:
      - "80:80"
    depends_on:
      - backend

  cAdvisor:
    image: gcr.io/cadvisor/cadvisor:latest
    container_name: cadvisor
    ports:
      - "8081:8080"
    volumes:
      - /var/run:/var/run:ro
      - /sys:/sys:ro
      - /var/lib/docker/:/var/lib/docker:ro
volumes:
  db_data:
